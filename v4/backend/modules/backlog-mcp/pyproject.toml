[project]
name = "backlog-mcp"
version = "0.1.0"
description = "Custom Backlog MCP server that lists issues with a caller-supplied token"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
  "httpx>=0.28.1,<0.29.0",
  "mcp>=2.0.0,<2.1.0",
  "pydantic-settings>=2.15.0,<2.16.0",
]

[dependency-groups]
dev = [
  "anyio>=4.14.2,<4.15.0",
  "mypy>=2.3.0,<2.4.0",
  "pytest>=9.1.1,<9.2.0",
  "ruff>=0.16.2,<0.16.3",
]

[build-system]
requires = ["uv_build>=0.12.2,<0.13.0"]
build-backend = "uv_build"

[tool.ruff]
target-version = "py313"
line-length = 100

[tool.mypy]
python_version = "3.13"
exclude = [".venv"]
follow_imports = "silent"
warn_redundant_casts = true
warn_unused_ignores = true
disallow_any_generics = true
no_implicit_reexport = true
disallow_untyped_defs = true
